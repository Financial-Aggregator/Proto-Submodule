syntax = "proto3";

option java_multiple_files = true;
option java_package = "ru.bank.cardmicroservice.proto.card.account";

service ClientCardAccountService {
  rpc GetCardHolder (GetCardHolderRequest) returns (GetCardHolderResponse);
}

message GetCardHolderRequest {
  string account_id = 1;
}

message GetCardHolderResponse {
  string user_id = 1;
}

