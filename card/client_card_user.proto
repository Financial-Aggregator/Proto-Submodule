syntax = "proto3";

option java_multiple_files = true;
option java_package = "ru.bank.cardmicroservice.proto.card.user";

service ClientCardUser {
    rpc IsExistUserById (IsExistUserByIdRequest) returns (IsExistUserByIdResponse);
    rpc GetUserIdByPhoneNumber (GetUserIdByPhoneNumberRequest) returns (GetUserIdByPhoneNumberResponse);
}

message GetUserIdByPhoneNumberRequest {
    string phone_number = 1;
}

message GetUserIdByPhoneNumberResponse {
    string user_id = 1;
}

message IsExistUserByIdRequest {
    string id = 1;
}

message IsExistUserByIdResponse {
    bool result = 1;
}